name: Generate Vimdoc
on:
  push:
    branches:
      - main
      - Development
    paths:
      - README.md
      - doc/pandoc.yaml
      - doc/vimdoc-filter.lua
      - .github/workflows/vimdoc.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vimdoc:
    name: Generate Vimdoc
    runs-on: ubuntu-latest
    # A manual run on another branch must not commit to it.
    if: github.ref_name == 'main' || github.ref_name == 'Development'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The vimdoc writer needs Pandoc 3.8.1 or later.
      - name: Generate Vimdoc
        uses: docker://pandoc/core:3.8
        with:
          args: >-
            README.md
            --from=markdown
            --to=vimdoc
            --standalone
            --columns=78
            --toc=true
            --shift-heading-level-by=-1
            --metadata-file=doc/pandoc.yaml
            --lua-filter=doc/vimdoc-filter.lua
            --output=doc/logger.txt

      # A push with GITHUB_TOKEN does not start this workflow again.
      - name: Commit generated Vimdoc
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add doc/logger.txt
          if git diff --cached --quiet; then
            echo "doc/logger.txt is current."
            exit 0
          fi
          git commit -m "docs: regenerate Vimdoc"
          git push origin HEAD:${{ github.ref_name }}
